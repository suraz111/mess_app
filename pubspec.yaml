name: messapp
description: "MessMate - Hostel Mess Departure & Meal Coordination App"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & Routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.0

  # UI & Typography
  google_fonts: ^6.2.1
  intl: ^0.20.2
  fl_chart: ^0.70.2

  # Local Storage & Offline
  shared_preferences: ^2.5.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Utilities
  uuid: ^4.5.1
  connectivity_plus: ^6.1.4
  url_launcher: ^6.3.1

  # QR & Scanning
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.4

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1

  # Firebase
  firebase_core: ^3.12.0
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_messaging: ^15.2.4
  firebase_storage: ^12.4.4

  # Gamification & Animations
  confetti: ^0.8.0
  lottie: ^3.3.1

  # Sharing & Export
  share_plus: ^10.1.4

  # Home Screen Widget
  home_widget: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/

